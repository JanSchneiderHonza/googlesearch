<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Search</title>
        <link rel="stylesheet" href="styles/styles.css">
    </head>
    <body>
        <main class="page-shell home-page">
            <header class="page-header">
                <p class="eyebrow">A simple place to start</p>
                <h1>Search</h1>
                <p>Explore the web with a query of your choice.</p>
            </header>

            <form action="https://www.google.com/search" method="get">
                <label class="visually-hidden" for="q">Search the web</label>
                <input id="q" type="text" name="q" placeholder="Search the web" required>
                <div class="button-row">
                    <button type="submit">Google Search</button>
                    <button class="button-secondary" type="submit" name="btnI" value="I">I'm Feeling Lucky</button>
                </div>
            </form>

            <nav class="page-links" aria-label="More search options">
                <a href="advsearch.html">Advanced Search</a>
                <a href="imgsearch.html">Image Search</a>
            </nav>
        </main>
        <footer class="page-footer">
            <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fjanschneiderhonza.github.io%2Fgooglesearch%2F"><img src="images/html-validator.svg" alt="HTML Validator"></a>
            <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fjanschneiderhonza.github.io%2Fgooglesearch%2F&amp;profile=css3svg&amp;usermedium=all&amp;warning=1&amp;vextwarning=&amp;lang=en"><img src="https://jigsaw.w3.org/css-validator/images/vcss" alt="Valid CSS"></a>
        </footer>
    </body>
</html>
