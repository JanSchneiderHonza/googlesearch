<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Search</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <main class="page-shell">
        <p class="back-link"><a href="index.html">Back to search</a></p>
        <header class="page-header">
            <p class="eyebrow">Make your query more precise</p>
            <h1>Advanced Search</h1>
            <p>Combine terms to narrow down your results.</p>
        </header>

        <form action="https://www.google.com/search" method="get">
            <div class="field">
                <label for="all-words">All these words:</label>
                <input id="all-words" type="text" name="as_q">
            </div>

            <div class="field">
                <label for="exact-phrase">Exact phrase:</label>
                <input id="exact-phrase" type="text" name="as_epq">
            </div>

            <div class="field">
                <label for="any-words">Any of these words:</label>
                <input id="any-words" type="text" name="as_oq">
            </div>

            <div class="field">
                <label for="exclude-words">None of these words:</label>
                <input id="exclude-words" type="text" name="as_eq">
            </div>

            <div class="field">
                <label for="site">Search only this site:</label>
                <input id="site" type="text" name="as_sitesearch"
                       placeholder="example.com">
            </div>

            <div class="button-row">
                <button type="submit">Advanced Search</button>
                <button class="button-secondary" type="submit" name="btnI" value="I">I'm Feeling Lucky</button>
            </div>
        </form>
    </main>
    <footer class="page-footer">
        <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fjanschneiderhonza.github.io%2Fgooglesearch%2F"><img src="images/html-validator.svg" alt="HTML Validator"></a>
        <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fjanschneiderhonza.github.io%2Fgooglesearch%2F&amp;profile=css3svg&amp;usermedium=all&amp;warning=1&amp;vextwarning=&amp;lang=en"><img src="https://jigsaw.w3.org/css-validator/images/vcss" alt="Valid CSS"></a>
    </footer>
</body>
</html>
